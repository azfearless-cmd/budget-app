<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תקציב">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>מעקב תקציב</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
body {
  font-family: 'Noto Sans Hebrew', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0F0F14; color: #E8E8F0;
  height: 100vh; height: -webkit-fill-available;
  overflow: hidden; -webkit-text-size-adjust: 100%;
}
#app {
  max-width: 480px; margin: 0 auto;
  height: 100vh; height: -webkit-fill-available;
  display: flex; flex-direction: column; overflow: hidden;
}
.header {
  background: #16161f;
  padding-top: max(env(safe-area-inset-top, 0px), 14px);
  padding-left: 20px; padding-right: 20px; padding-bottom: 0;
  border-bottom: 1px solid #222; flex-shrink: 0; z-index: 10;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.header-title { font-size: 20px; font-weight: 800; }
.header-sub { font-size: 11px; color: #666; margin-top: 2px; }
.avatars { display: flex; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.tabs { display: flex; }
.tab-btn { flex: 1; background: none; border: none; cursor: pointer; padding: 9px 0 12px; font-family: inherit; font-size: 11px; font-weight: 600; color: #555; border-bottom: 2px solid transparent; touch-action: manipulation; }
.tab-btn.active { color: #E8C547; border-bottom-color: #E8C547; }
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding: 16px 20px; padding-left: max(env(safe-area-inset-left, 0px), 20px); padding-right: max(env(safe-area-inset-right, 0px), 20px); padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 30px), 40px); }
.card { background: linear-gradient(135deg,#1e1e2e,#252535); border-radius: 16px; padding: 18px; margin-bottom: 14px; border: 1px solid #2a2a3a; }
.card-sm { background: #16161f; border-radius: 14px; padding: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.bal-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.bal-amount { font-size: 32px; font-weight: 800; }
.bal-row { display: flex; gap: 14px; margin-top: 10px; }
.bal-item .lbl { font-size: 10px; color: #888; }
.bal-item .val { font-size: 13px; font-weight: 600; }
.prog-wrap { margin-top: 12px; }
.prog-info { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-bottom: 5px; }
.prog-bg { background: #1a1a2a; border-radius: 4px; height: 7px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 4px; transition: width .6s; }
.u-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.u-amount { font-size: 18px; font-weight: 800; }
.u-spent { font-size: 10px; color: #888; margin-top: 2px; }
.u-edit { margin-top: 7px; font-size: 10px; background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; touch-action: manipulation; }
.sec-title { font-weight: 700; font-size: 12px; color: #888; margin-bottom: 8px; }
.tx-row { display: flex; align-items: center; padding: 12px 4px; gap: 10px; border-bottom: 1px solid #1e1e2e; }
.tx-icon { font-size: 20px; flex-shrink: 0; }
.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 10px; color: #555; margin-top: 2px; }
.tx-amt { font-weight: 700; font-size: 13px; flex-shrink: 0; }
.del-btn { background: none; border: none; cursor: pointer; color: #ff6b6b; font-size: 18px; flex-shrink: 0; padding: 6px; opacity: 0.6; touch-action: manipulation; }
.empty { text-align: center; color: #555; padding: 40px 0; font-size: 13px; line-height: 2; }
.form-card { background: #16161f; border-radius: 16px; padding: 18px; border: 1px solid #222; }
.form-title { font-weight: 700; font-size: 15px; margin-bottom: 16px; }
.f-label { font-size: 11px; color: #888; margin-bottom: 5px; display: block; }
.f-group { margin-bottom: 14px; }
.toggle-row { display: flex; background: #0f0f14; border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.tgl-btn { flex: 1; padding: 9px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; background: none; color: #555; touch-action: manipulation; }
.tgl-btn.exp { background: #ff6b6b22; color: #ff6b6b; }
.tgl-btn.inc { background: #5CE8C022; color: #5CE8C0; }
.user-row { display: flex; gap: 8px; }
.u-btn { flex: 1; padding: 10px; border: 1.5px solid #333; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; background: #111; color: #666; touch-action: manipulation; }
/* font-size 16px = prevents iOS Safari auto-zoom on focus */
input[type=number], input[type=text] { width: 100%; background: #111; border: 1px solid #333; color: #fff; border-radius: 10px; padding: 11px 14px; font-size: 16px; font-family: inherit; -webkit-appearance: none; appearance: none; }
input[type=number].big { font-size: 28px; font-weight: 800; }
input:focus { border-color: #E8C547; outline: none; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-btn { padding: 7px 12px; border-radius: 20px; border: 1.5px solid #333; background: #111; color: #666; cursor: pointer; font-size: 12px; font-family: inherit; touch-action: manipulation; }
.cat-btn.on { border-color: #E8C547; background: #E8C54722; color: #E8C547; }
.submit-btn { width: 100%; padding: 15px; background: #E8C547; color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit; margin-top: 6px; touch-action: manipulation; }
.submit-btn:disabled { opacity: 0.4; }
.filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.f-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #333; background: #111; color: #666; cursor: pointer; font-size: 12px; font-family: inherit; touch-action: manipulation; }
.f-btn.on { border-color: #E8C547; background: #E8C54722; color: #E8C547; }
.bar-row { margin-bottom: 11px; }
.bar-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.bar-bg { background: #1a1a2a; border-radius: 4px; height: 6px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg,#E8C547,#f0d060); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; text-align: center; }
.stat-box { background: #111; border-radius: 10px; padding: 9px 5px; }
.s-lbl { font-size: 10px; color: #666; }
.s-val { font-size: 12px; font-weight: 700; margin-top: 3px; }
.danger-btn { margin-top: 18px; width: 100%; padding: 12px; background: none; border: 1.5px solid #ff6b6b44; color: #ff6b6b88; border-radius: 10px; cursor: pointer; font-size: 13px; font-family: inherit; touch-action: manipulation; }
.modal { background: #1e1e2e; border-radius: 14px; padding: 16px; border: 1px solid #333; margin-bottom: 14px; }
.modal-title { font-weight: 700; margin-bottom: 12px; }
.modal-btns { display: flex; gap: 8px; margin-top: 12px; }
.btn-save { flex: 1; background: #E8C547; color: #000; border: none; border-radius: 8px; padding: 11px; font-weight: 700; cursor: pointer; font-family: inherit; touch-action: manipulation; }
.btn-cancel { flex: 1; background: #222; color: #888; border: none; border-radius: 8px; padding: 11px; font-weight: 600; cursor: pointer; font-family: inherit; touch-action: manipulation; }
#ios-banner { display: none; position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: #1e1e2e; border-top: 1px solid #E8C54744; padding: 14px 20px; padding-bottom: max(calc(env(safe-area-inset-bottom,0px) + 14px), 28px); z-index: 100; }
#ios-banner.show { display: block; }
.ios-text { font-size: 13px; color: #ccc; line-height: 1.6; }
.ios-text strong { color: #E8C547; }
.ios-close { float: left; background: none; border: none; color: #666; font-size: 22px; cursor: pointer; padding: 0 4px; font-family: inherit; touch-action: manipulation; line-height: 1; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
.fade-in { animation: fadeIn .25s ease; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">מעקב תקציב</div>
        <div class="header-sub">משותף לשני אנשים</div>
      </div>
      <div class="avatars" id="avatars"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 סקירה</button>
      <button class="tab-btn" data-tab="add" onclick="switchTab('add')">➕ הוסף</button>
      <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 היסטוריה</button>
      <button class="tab-btn" data-tab="analysis" onclick="switchTab('analysis')">💡 ניתוח</button>
      <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">⚙️ הגדרות</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="ios-banner">
  <button class="ios-close" onclick="closeBanner()">×</button>
  <div class="ios-text">📲 להוספה למסך הבית: לחץ <strong>⬆️ שיתוף</strong> ← <strong>"הוסף למסך הבית"</strong></div>
</div>

<script>
// Safe storage — localStorage throws on iOS when opening local files
const store = (() => {
  try {
    localStorage.setItem('_t','1'); localStorage.removeItem('_t');
    return { get: k => { try{return localStorage.getItem(k);}catch(e){return null;} }, set: (k,v) => { try{localStorage.setItem(k,v);}catch(e){} } };
  } catch(e) {
    const m={};
    return { get: k => m[k]||null, set: (k,v) => { m[k]=v; } };
  }
})();

const DEFAULT_USERS = [
  {id:'user1',name:'משתמש א׳',color:'#E8C547',initial:'א'},
  {id:'user2',name:'משתמש ב׳',color:'#5CE8C0',initial:'ב'},
];
let USERS = [...DEFAULT_USERS];
const CATS = ['🏠 דיור','🍔 אוכל','🚗 תחבורה','🛍️ קניות','💊 בריאות','🎉 בילויים','📚 חינוך','💡 חשבונות','✈️ טיולים','🔧 אחר'];

let S = {
  tab:'dashboard', transactions:[], budget:{user1:5000,user2:5000},
  form:{user:'user1',amount:'',cat:CATS[0],desc:'',type:'expense'},
  filter:'all', editBudget:false, tmpBudget:{user1:5000,user2:5000},
};

function load() {
  try {
    const tx=store.get('tx'), bg=store.get('bg'), un=store.get('users');
    if(tx) S.transactions=JSON.parse(tx);
    if(bg) { S.budget=JSON.parse(bg); S.tmpBudget={...S.budget}; }
    if(un) USERS=JSON.parse(un);
  } catch(e) {}
}
function save() {
  store.set('tx',JSON.stringify(S.transactions));
  store.set('bg',JSON.stringify(S.budget));
  store.set('users',JSON.stringify(USERS));
}

const fmt = n => new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n);
const spent  = u => S.transactions.filter(t=>t.user===u&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
const income = u => S.transactions.filter(t=>t.user===u&&t.type==='income').reduce((s,t)=>s+t.amount,0);
const bal    = u => S.budget[u]+income(u)-spent(u);

function switchTab(tab) {
  S.tab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  render();
}

function renderAvatars() {
  document.getElementById('avatars').innerHTML=USERS.map(u=>
    `<div class="avatar" style="background:${u.color}22;border:2px solid ${u.color};color:${u.color}">${u.initial}</div>`
  ).join('');
}

function render() {
  const c=document.getElementById('content');
  c.className='content fade-in';
  c.innerHTML = S.tab==='dashboard'?renderDash():S.tab==='add'?renderAdd():S.tab==='history'?renderHist():S.tab==='settings'?renderSettings():renderAnal();
}

function renderDash() {
  const tb=S.budget.user1+S.budget.user2, ts=spent('user1')+spent('user2'), ti=income('user1')+income('user2');
  const b=tb+ti-ts, pct=tb>0?Math.min(100,(ts/tb)*100):0;
  const bc=pct>90?'#ff6b6b':pct>70?'#E8C547':'#5CE8C0';
  let h=`<div class="card">
    <div class="bal-label">יתרה כוללת</div>
    <div class="bal-amount" style="color:${b>=0?'#5CE8C0':'#ff6b6b'}">${fmt(b)}</div>
    <div class="bal-row">
      <div class="bal-item"><div class="lbl">תקציב</div><div class="val">${fmt(tb)}</div></div>
      <div class="bal-item"><div class="lbl">הוצאות</div><div class="val" style="color:#ff6b6b">${fmt(ts)}</div></div>
      <div class="bal-item"><div class="lbl">הכנסות</div><div class="val" style="color:#5CE8C0">${fmt(ti)}</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-info"><span>ניצול תקציב</span><span>${Math.round(pct)}%</span></div>
      <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${bc}"></div></div>
    </div></div><div class="grid2">`;
  USERS.forEach(u=>{
    const s=spent(u.id),bv=bal(u.id),p=S.budget[u.id]>0?Math.min(100,(s/S.budget[u.id])*100):0;
    h+=`<div class="card-sm" style="border:1px solid ${u.color}33">
      <div class="u-header">
        <div class="avatar" style="width:26px;height:26px;font-size:10px;background:${u.color}22;border:1.5px solid ${u.color};color:${u.color}">${u.initial}</div>
        <div style="font-size:11px;font-weight:600">${u.name}</div>
      </div>
      <div class="u-amount" style="color:${bv>=0?u.color:'#ff6b6b'}">${fmt(bv)}</div>
      <div class="u-spent">הוצאות: ${fmt(s)}</div>
      <div class="prog-bg" style="margin-top:7px;height:4px"><div class="prog-fill" style="width:${p}%;background:${u.color}"></div></div>
      <button class="u-edit" style="color:${u.color}" onclick="startEdit()">תקציב: ${fmt(S.budget[u.id])}</button>
    </div>`;
  });
  h+=`</div>`;
  if(S.editBudget) h+=`<div class="modal"><div class="modal-title">✏️ עריכת תקציב</div>
    ${USERS.map(u=>`<div class="f-group"><label class="f-label" style="color:${u.color}">${u.name}</label>
      <input type="number" inputmode="decimal" id="tb_${u.id}" value="${S.tmpBudget[u.id]}"></div>`).join('')}
    <div class="modal-btns"><button class="btn-save" onclick="saveBudget()">שמור</button><button class="btn-cancel" onclick="cancelEdit()">ביטול</button></div>
  </div>`;
  h+=`<div class="sec-title">עסקאות אחרונות</div>`;
  const r=S.transactions.slice(0,5);
  if(!r.length) h+=`<div class="empty">אין עסקאות עדיין<br>לחץ ➕ להוסיף</div>`;
  else r.forEach(tx=>{const u=USERS.find(u=>u.id===tx.user);h+=txRow(tx,u,false);});
  return h;
}

function renderAdd() {
  const f=S.form;
  return `<div class="form-card">
    <div class="form-title">הוספת עסקה</div>
    <div class="toggle-row">
      <button class="tgl-btn ${f.type==='expense'?'exp':''}" onclick="setType('expense')">🔴 הוצאה</button>
      <button class="tgl-btn ${f.type==='income'?'inc':''}" onclick="setType('income')">🟢 הכנסה</button>
    </div>
    <div class="f-group"><label class="f-label">משתמש</label>
      <div class="user-row">${USERS.map(u=>`<button class="u-btn" style="${f.user===u.id?`border-color:${u.color};background:${u.color}22;color:${u.color}`:''}" onclick="setUser('${u.id}')">${u.name}</button>`).join('')}</div>
    </div>
    <div class="f-group"><label class="f-label">סכום (₪)</label>
      <input class="big" type="number" inputmode="decimal" id="fAmt" placeholder="0" value="${f.amount}" oninput="S.form.amount=this.value">
    </div>
    <div class="f-group"><label class="f-label">קטגוריה</label>
      <div class="cat-grid">${CATS.map(c=>`<button class="cat-btn ${f.cat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div>
    </div>
    <div class="f-group"><label class="f-label">תיאור (אופציונלי)</label>
      <input type="text" id="fDesc" placeholder="מה קנית?" value="${f.desc}" oninput="S.form.desc=this.value">
    </div>
    <button class="submit-btn" onclick="addTx()" ${!f.amount?'disabled':''}>הוסף עסקה ✓</button>
  </div>`;
}

function renderHist() {
  const list=S.filter==='all'?S.transactions:S.transactions.filter(t=>t.user===S.filter);
  let h=`<div class="filter-row">
    <button class="f-btn ${S.filter==='all'?'on':''}" onclick="setFilter('all')">הכל</button>
    ${USERS.map(u=>`<button class="f-btn ${S.filter===u.id?'on':''}" onclick="setFilter('${u.id}')">${u.name}</button>`).join('')}
  </div>`;
  if(!list.length) h+=`<div class="empty">אין עסקאות</div>`;
  else list.forEach(tx=>{const u=USERS.find(u=>u.id===tx.user);h+=txRow(tx,u,true);});
  return h;
}

function renderAnal() {
  const cats=CATS.map(c=>({c,t:S.transactions.filter(tx=>tx.category===c&&tx.type==='expense').reduce((s,tx)=>s+tx.amount,0)})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  let h=`<div class="sec-title">הוצאות לפי קטגוריה</div>`;
  if(!cats.length) h+=`<div class="empty">אין נתונים</div>`;
  else cats.forEach(({c,t})=>{
    const p=(t/(cats[0].t||1))*100;
    h+=`<div class="bar-row"><div class="bar-info"><span>${c}</span><span style="font-weight:700">${fmt(t)}</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${p}%"></div></div></div>`;
  });
  h+=`<div class="sec-title" style="margin-top:20px">סיכום לפי משתמש</div>`;
  USERS.forEach(u=>{
    const s=spent(u.id),i=income(u.id),cnt=S.transactions.filter(t=>t.user===u.id).length;
    h+=`<div class="card-sm" style="border:1px solid ${u.color}22;margin-bottom:10px">
      <div class="u-header">
        <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${u.color}22;border:1.5px solid ${u.color};color:${u.color}">${u.initial}</div>
        <div style="font-weight:700">${u.name}</div>
        <div style="font-size:10px;color:#555;margin-right:auto">${cnt} עסקאות</div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="s-lbl">תקציב</div><div class="s-val" style="color:#888">${fmt(S.budget[u.id])}</div></div>
        <div class="stat-box"><div class="s-lbl">הוצאות</div><div class="s-val" style="color:#ff6b6b">${fmt(s)}</div></div>
        <div class="stat-box"><div class="s-lbl">הכנסות</div><div class="s-val" style="color:#5CE8C0">${fmt(i)}</div></div>
      </div></div>`;
  });
  if(S.transactions.length) h+=`<button class="danger-btn" onclick="clearAll()">🗑️ מחיקת כל הנתונים</button>`;
  return h;
}

function txRow(tx,u,del) {
  return `<div class="tx-row">
    <div class="tx-icon">${tx.category.split(' ')[0]}</div>
    <div class="tx-info">
      <div class="tx-name">${tx.description}</div>
      <div class="tx-meta">${tx.date} · <span style="color:${u.color}">${u.name}</span></div>
    </div>
    <div class="tx-amt" style="color:${tx.type==='income'?'#5CE8C0':'#ff6b6b'}">${tx.type==='income'?'+':'-'}${fmt(tx.amount)}</div>
    ${del?`<button class="del-btn" onclick="delTx(${tx.id})">✕</button>`:''}
  </div>`;
}

function renderSettings() {
  return `<div class="form-card">
    <div class="form-title">⚙️ הגדרות</div>
    <div class="f-group">
      <div class="sec-title" style="margin-bottom:12px">שמות משתמשים</div>
      ${USERS.map(u=>`
        <div style="margin-bottom:12px">
          <label class="f-label" style="color:${u.color}">
            <span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${u.color}22;border:1.5px solid ${u.color};text-align:center;line-height:20px;font-size:10px;font-weight:700;color:${u.color};margin-left:6px">${u.initial}</span>
            משתמש ${u.id==='user1'?'1':'2'}
          </label>
          <input type="text" id="uname_${u.id}" value="${u.name}" placeholder="שם המשתמש">
        </div>`).join('')}
      <button class="submit-btn" onclick="saveNames()" style="margin-top:4px">שמור שמות ✓</button>
    </div>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #222">
      <div class="sec-title" style="margin-bottom:12px">תקציב חודשי</div>
      ${USERS.map(u=>`
        <div style="margin-bottom:12px">
          <label class="f-label" style="color:${u.color}">${u.name}</label>
          <input type="number" inputmode="decimal" id="bgt_${u.id}" value="${S.budget[u.id]}">
        </div>`).join('')}
      <button class="submit-btn" onclick="saveBudgetSettings()" style="margin-top:4px">שמור תקציב ✓</button>
    </div>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #222">
      <button class="danger-btn" style="margin-top:0" onclick="clearAll()">🗑️ מחיקת כל הנתונים</button>
    </div>
  </div>`;
}

function saveNames() {
  USERS.forEach(u=>{
    const el=document.getElementById('uname_'+u.id);
    if(el&&el.value.trim()) u.name=el.value.trim();
  });
  save(); renderAvatars(); render();
}

function saveBudgetSettings() {
  USERS.forEach(u=>{
    const el=document.getElementById('bgt_'+u.id);
    if(el) S.budget[u.id]=parseFloat(el.value)||0;
  });
  S.tmpBudget={...S.budget}; save(); render();
}
function setUser(u){S.form.user=u;render();}
function setCat(c){S.form.cat=c;render();}
function setFilter(f){S.filter=f;render();}
function startEdit(){S.editBudget=true;S.tmpBudget={...S.budget};render();}
function cancelEdit(){S.editBudget=false;render();}

function saveBudget(){
  USERS.forEach(u=>{const el=document.getElementById('tb_'+u.id);if(el)S.tmpBudget[u.id]=parseFloat(el.value)||0;});
  S.budget={...S.tmpBudget};S.editBudget=false;save();render();
}
function addTx(){
  const a=document.getElementById('fAmt'),d=document.getElementById('fDesc');
  if(a)S.form.amount=a.value;if(d)S.form.desc=d.value;
  if(!S.form.amount||isNaN(parseFloat(S.form.amount)))return;
  S.transactions=[{id:Date.now(),user:S.form.user,amount:parseFloat(S.form.amount),category:S.form.cat,description:S.form.desc||S.form.cat,type:S.form.type,date:new Date().toLocaleDateString('he-IL')},...S.transactions];
  S.form.amount='';S.form.desc='';save();render();
}
function delTx(id){S.transactions=S.transactions.filter(t=>t.id!==id);save();render();}
function clearAll(){if(confirm('למחוק את כל העסקאות?')){S.transactions=[];save();render();}}

// iOS install hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
if(isIOS&&!isStandalone&&!store.get('ios-closed')) document.getElementById('ios-banner').classList.add('show');
function closeBanner(){document.getElementById('ios-banner').classList.remove('show');store.set('ios-closed','1');}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

load(); renderAvatars(); render();
</script>
</body>
</html>
